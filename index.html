<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cosmic Bagatelle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a120b;
      color: #f5e6c8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #e8c07a;
      text-shadow: 0 0 10px rgba(232,192,122,0.4);
    }
    #ui {
      display: flex;
      gap: 20px;
      margin-bottom: 8px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    #ui span { color: #f0d9a0; }
    #game-container {
      position: relative;
      border: 4px solid #5c3a1e;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.4);
      background: #3b2414;
    }
    canvas {
      display: block;
      border-radius: 4px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(20,10,5,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 20;
      text-align: center;
    }
    #overlay.show { display: flex; }
    #overlay h2 { font-size: 1.6rem; color: #e8a050; margin-bottom: 8px; }
    #overlay p { font-size: 1.15rem; margin: 4px 0; color: #f5e6c8; }
    .btn {
      margin-top: 18px;
      padding: 12px 34px;
      font-size: 1.15rem;
      background: linear-gradient(90deg, #8b5a2b, #c49a6c);
      border: none;
      border-radius: 30px;
      color: #1a120b;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(196,154,108,0.5);
    }
    .controls {
      margin-top: 10px;
      text-align: center;
      color: #c4a574;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>🪵 COSMIC BAGATELLE</h1>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="highScore">0</span></div>
    <div>Balls: <span id="ballsLeft">5</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="400" height="580"></canvas>
    <div id="overlay">
      <h2>Game Over</h2>
      <p>Final Score: <span id="finalScore">0</span></p>
      <p>High Score: <span id="finalHigh">0</span></p>
      <button class="btn" id="restartBtn">Play Again</button>
    </div>
  </div>

  <div class="controls">
    Hold & release to set power • Aim with left/right
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const ballsLeftEl = document.getElementById('ballsLeft');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighEl = document.getElementById('finalHigh');
    const restartBtn = document.getElementById('restartBtn');

    // Persistent high score
    let highScore = parseInt(localStorage.getItem('bagatelleHigh') || '0');
    highScoreEl.textContent = highScore;

    let score = 0;
    let ballsLeft = 5;
    let gameOver = false;
    let charging = false;
    let chargePower = 0;
    let aim = 0; // -1 to 1

    // Ball
    const ball = {
      x: 200,
      y: 540,
      vx: 0,
      vy: 0,
      radius: 8,
      active: false,
      settled: false
    };

    // Pins (classic layout)
    const pins = [];
    function createPins() {
      // Top triangle area
      for (let row = 0; row < 9; row++) {
        const pinsInRow = row + 1;
        const startX = 200 - (pinsInRow - 1) * 18;
        for (let i = 0; i < pinsInRow; i++) {
          pins.push({
            x: startX + i * 36,
            y: 60 + row * 32
          });
        }
      }
      // Extra scattered pins for more chaos
      const extras = [
        [80, 360], [120, 380], [280, 370], [320, 355],
        [90, 430], [160, 450], [240, 445], [310, 430],
        [70, 300], [330, 290]
      ];
      extras.forEach(p => pins.push({ x: p[0], y: p[1] }));
    }
    createPins();

    // Scoring pockets (bottom)
    const pockets = [
      { x: 50,  y: 510, w: 40, points: 90,  label: '90' },
      { x: 100, y: 510, w: 45, points: 125, label: '125' },
      { x: 155, y: 510, w: 50, points: 150, label: '150' },
      { x: 215, y: 510, w: 45, points: 100, label: '100' },
      { x: 270, y: 510, w: 40, points: 80,  label: '80' },
      { x: 320, y: 510, w: 40, points: 60,  label: '60' },
      // Side high value
      { x: 30,  y: 420, w: 30, points: 40,  label: '40' },
      { x: 340, y: 420, w: 30, points: 40,  label: '40' }
    ];

    const gravity = 0.18;
    const friction = 0.991;
    const pinBounce = 0.7;

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('bagatelleHigh', highScore);
        highScoreEl.textContent = highScore;
      }
    }

    function resetBall() {
      ball.x = 200 + aim * 30;
      ball.y = 540;
      ball.vx = 0;
      ball.vy = 0;
      ball.active = false;
      ball.settled = false;
      chargePower = 0;
    }

    function launchBall() {
      if (ball.active || gameOver || ballsLeft <= 0) return;
      ball.active = true;
      ball.settled = false;
      const power = 9 + chargePower * 11;
      ball.vy = -power;
      ball.vx = aim * 4.5 + (Math.random() - 0.5) * 1.2;
      ballsLeft--;
      ballsLeftEl.textContent = ballsLeft;
    }

    function checkPins() {
      pins.forEach(pin => {
        const dx = ball.x - pin.x;
        const dy = ball.y - pin.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < ball.radius + 4) {
          const nx = dx / dist || 0;
          const ny = dy / dist || 0;
          const overlap = ball.radius + 4 - dist;
          ball.x += nx * overlap;
          ball.y += ny * overlap;
          const dot = ball.vx * nx + ball.vy * ny;
          ball.vx -= 2 * pinBounce * dot * nx;
          ball.vy -= 2 * pinBounce * dot * ny;
          // slight random chaos
          ball.vx += (Math.random() - 0.5) * 0.8;
        }
      });
    }

    function checkPockets() {
      if (ball.settled) return;
      // Only check when ball is slow and near bottom
      if (Math.abs(ball.vy) < 1.2 && Math.abs(ball.vx) < 1.2 && ball.y > 480) {
        for (const p of pockets) {
          if (ball.x > p.x && ball.x < p.x + p.w && ball.y > p.y - 10) {
            // Caught!
            ball.settled = true;
            ball.active = false;
            score += p.points;
            scoreEl.textContent = score;
            updateHighScore();
            // small delay then next ball
            setTimeout(() => {
              if (ballsLeft > 0) {
                resetBall();
              } else {
                endGame();
              }
            }, 700);
            return;
          }
        }
      }
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = score;
      finalHighEl.textContent = highScore;
      overlay.classList.add('show');
    }

    function restartGame() {
      score = 0;
      ballsLeft = 5;
      gameOver = false;
      scoreEl.textContent = 0;
      ballsLeftEl.textContent = 5;
      overlay.classList.remove('show');
      resetBall();
    }

    function update() {
      if (gameOver) return;

      if (charging) {
        chargePower = Math.min(chargePower + 0.02, 1);
      }

      if (!ball.active) return;

      ball.vy += gravity;
      ball.vx *= friction;
      ball.vy *= friction;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Walls
      if (ball.x < ball.radius + 6) {
        ball.x = ball.radius + 6;
        ball.vx *= -0.75;
      }
      if (ball.x > 400 - ball.radius - 6) {
        ball.x = 400 - ball.radius - 6;
        ball.vx *= -0.75;
      }
      if (ball.y < ball.radius + 6) {
        ball.y = ball.radius + 6;
        ball.vy *= -0.7;
      }

      // Floor
      if (ball.y > 560 - ball.radius) {
        ball.y = 560 - ball.radius;
        ball.vy *= -0.45;
        ball.vx *= 0.85;
        if (Math.abs(ball.vy) < 0.6) ball.vy = 0;
      }

      checkPins();
      checkPockets();

      // Failsafe – if ball somehow stops high up
      if (ball.active && Math.abs(ball.vx) < 0.3 && Math.abs(ball.vy) < 0.3 && ball.y < 480) {
        ball.vy = 0.8; // give it a tiny push down
      }
    }

    function draw() {
      // Wooden background
      const grad = ctx.createLinearGradient(0, 0, 0, 580);
      grad.addColorStop(0, '#5c3a1e');
      grad.addColorStop(0.5, '#4a2f18');
      grad.addColorStop(1, '#3b2414');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 400, 580);

      // Wood grain lines
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      for (let y = 20; y < 580; y += 18) {
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(y)*3);
        ctx.lineTo(400, y + Math.sin(y+1)*3);
        ctx.stroke();
      }

      // Arch at top
      ctx.beginPath();
      ctx.moveTo(20, 50);
      ctx.quadraticCurveTo(200, -20, 380, 50);
      ctx.strokeStyle = '#2a1a0f';
      ctx.lineWidth = 8;
      ctx.stroke();

      // Pins
      pins.forEach(pin => {
        ctx.beginPath();
        ctx.arc(pin.x, pin.y, 3.5, 0, Math.PI*2);
        ctx.fillStyle = '#d4a96a';
        ctx.fill();
        ctx.strokeStyle = '#2a1a0f';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // Scoring pockets
      pockets.forEach(p => {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(p.x, p.y, p.w, 22);
        ctx.strokeStyle = '#c49a6c';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(p.x, p.y, p.w, 22);

        ctx.fillStyle = '#f0d9a0';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.label, p.x + p.w/2, p.y + 16);
      });

      // Launch chute
      ctx.fillStyle = '#2a1a0f';
      ctx.fillRect(185, 520, 30, 40);

      // Ball
      if (ball.active || !gameOver) {
        const g = ctx.createRadialGradient(ball.x-2, ball.y-2, 0, ball.x, ball.y, ball.radius);
        g.addColorStop(0, '#fff');
        g.addColorStop(0.5, '#ddd');
        g.addColorStop(1, '#888');
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Charge meter
      if (charging || chargePower > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(20, 20, 120, 14);
        ctx.fillStyle = `rgb(${100 + chargePower*155}, ${200 - chargePower*100}, 50)`;
        ctx.fillRect(20, 20, 120 * chargePower, 14);
        ctx.strokeStyle = '#c49a6c';
        ctx.strokeRect(20, 20, 120, 14);
      }

      // Aim indicator
      if (!ball.active && !gameOver) {
        ctx.strokeStyle = 'rgba(240,217,160,0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(200 + aim * 30, 540);
        ctx.lineTo(200 + aim * 30 + aim * 40, 480);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Controls
    function startCharge(e) {
      if (gameOver || ball.active) return;
      charging = true;
      chargePower = 0;
    }
    function endCharge(e) {
      if (!charging) return;
      charging = false;
      launchBall();
      chargePower = 0;
    }

    // Touch
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches[0].clientX - rect.left) * (400 / rect.width);
      aim = Math.max(-1, Math.min(1, (x - 200) / 100));
      startCharge();
    }, {passive: false});

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      endCharge();
    }, {passive: false});

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches[0].clientX - rect.left) * (400 / rect.width);
      aim = Math.max(-1, Math.min(1, (x - 200) / 100));
    }, {passive: false});

    // Mouse
    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (400 / rect.width);
      aim = Math.max(-1, Math.min(1, (x - 200) / 100));
      startCharge();
    });
    canvas.addEventListener('mouseup', endCharge);
    canvas.addEventListener('mousemove', e => {
      if (!charging) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (400 / rect.width);
      aim = Math.max(-1, Math.min(1, (x - 200) / 100));
    });

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') startCharge();
      if (e.code === 'ArrowLeft') aim = Math.max(-1, aim - 0.1);
      if (e.code === 'ArrowRight') aim = Math.min(1, aim + 0.1);
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'Space') endCharge();
    });

    restartBtn.addEventListener('click', restartGame);
    restartBtn.addEventListener('touchstart', e => { e.preventDefault(); restartGame(); });

    resetBall();
    loop();
  </script>
</body>
</html>
