<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cosmic Bagatelle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a120b;
      color: #f5e6c8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      color: #e8c07a;
    }
    #ui {
      display: flex;
      gap: 16px;
      margin-bottom: 6px;
      font-size: 1rem;
      font-weight: 600;
    }
    #ui span { color: #f0d9a0; }
    #game-container {
      position: relative;
      border: 4px solid #5c3a1e;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
      background: #3b2414;
    }
    canvas { display: block; border-radius: 4px; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(20,10,5,0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 20;
      text-align: center;
    }
    #overlay.show { display: flex; }
    #overlay h2 { font-size: 1.5rem; color: #e8a050; margin-bottom: 8px; }
    #overlay p { font-size: 1.1rem; margin: 3px 0; }
    .btn {
      margin-top: 16px;
      padding: 12px 32px;
      font-size: 1.1rem;
      background: linear-gradient(90deg, #8b5a2b, #c49a6c);
      border: none;
      border-radius: 30px;
      color: #1a120b;
      font-weight: 700;
      cursor: pointer;
    }
    .controls {
      margin-top: 8px;
      text-align: center;
      color: #c4a574;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <h1>🪵 COSMIC BAGATELLE</h1>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="highScore">0</span></div>
    <div>Balls: <span id="ballsLeft">5</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="400" height="580"></canvas>
    <div id="overlay">
      <h2>Game Over</h2>
      <p>Final Score: <span id="finalScore">0</span></p>
      <p>High Score: <span id="finalHigh">0</span></p>
      <button class="btn" id="restartBtn">Play Again</button>
    </div>
  </div>

  <div class="controls">
    Pull the plunger on the right, then release
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const ballsLeftEl = document.getElementById('ballsLeft');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighEl = document.getElementById('finalHigh');
    const restartBtn = document.getElementById('restartBtn');

    let highScore = parseInt(localStorage.getItem('bagatelleHigh') || '0');
    highScoreEl.textContent = highScore;

    let score = 0;
    let ballsLeft = 5;
    let gameOver = false;

    let plungerY = 0;
    let pulling = false;
    let plungerPower = 0;

    const ball = {
      x: 378, y: 505,
      vx: 0, vy: 0,
      radius: 7,
      active: false,
      settled: false,
      inChute: true
    };

    // Pins
    const pins = [];
    function buildPins() {
      for (let row = 0; row < 10; row++) {
        const count = row + 1;
        const startX = 200 - (count - 1) * 16;
        for (let i = 0; i < count; i++) {
          pins.push({ x: startX + i * 32, y: 55 + row * 28 });
        }
      }
      // Extra pins
      [[65,340],[105,365],[295,355],[335,340],
       [80,415],[145,435],[255,430],[325,410],
       [55,275],[345,270],[175,305],[225,315]].forEach(p => {
        pins.push({ x: p[0], y: p[1] });
      });
    }
    buildPins();

    // Scoring pockets – numbers sit clearly on the bottom line
    const pockets = [
      { x: 40,  points: 90,  label: '90' },
      { x: 95,  points: 125, label: '125' },
      { x: 155, points: 150, label: '150' },
      { x: 215, points: 100, label: '100' },
      { x: 270, points: 80,  label: '80' },
      { x: 325, points: 60,  label: '60' }
    ];

    const gravity = 0.155;
    const friction = 0.994;

    function updateHigh() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('bagatelleHigh', highScore);
        highScoreEl.textContent = highScore;
      }
    }

    function resetBall() {
      ball.x = 378;
      ball.y = 505;
      ball.vx = 0;
      ball.vy = 0;
      ball.active = false;
      ball.settled = false;
      ball.inChute = true;
      plungerY = 0;
      plungerPower = 0;
    }

    function fireBall() {
      if (ball.active || gameOver || ballsLeft <= 0) return;
      ball.active = true;
      ball.settled = false;
      ball.inChute = true;
      const power = 11 + plungerPower * 12;
      ball.vy = -power;
      ball.vx = 0;
      ballsLeft--;
      ballsLeftEl.textContent = ballsLeft;
      plungerY = 0;
      plungerPower = 0;
    }

    function checkPins() {
      if (ball.inChute) return;

      for (let i = 0; i < pins.length; i++) {
        const pin = pins[i];
        const dx = ball.x - pin.x;
        const dy = ball.y - pin.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.1) continue;

        if (dist < ball.radius + 4.3) {
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = (ball.radius + 4.3) - dist;
          ball.x += nx * overlap;
          ball.y += ny * overlap;

          const dot = ball.vx * nx + ball.vy * ny;
          ball.vx -= 1.75 * dot * nx;
          ball.vy -= 1.75 * dot * ny;
          ball.vx += (Math.random() - 0.5) * 0.6;
        }
      }
    }

    function checkPockets() {
      if (ball.settled || !ball.active || ball.inChute) return;
      if (ball.y < 500) return;

      // Slow enough to be caught
      if (Math.abs(ball.vx) > 1.6 || Math.abs(ball.vy) > 1.6) return;

      for (let i = 0; i < pockets.length; i++) {
        const p = pockets[i];
        const cx = p.x + 20;
        const cy = 538;
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        if (Math.sqrt(dx * dx + dy * dy) < 20) {
          // Caught!
          ball.settled = true;
          ball.active = false;
          ball.x = cx;
          ball.y = cy;
          score += p.points;
          scoreEl.textContent = score;
          updateHigh();

          setTimeout(() => {
            if (ballsLeft > 0) {
              resetBall();
            } else {
              endGame();
            }
          }, 700);
          return;
        }
      }
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = score;
      finalHighEl.textContent = highScore;
      overlay.classList.add('show');
    }

    function restartGame() {
      score = 0;
      ballsLeft = 5;
      gameOver = false;
      scoreEl.textContent = 0;
      ballsLeftEl.textContent = 5;
      overlay.classList.remove('show');
      resetBall();
    }

    function update() {
      if (gameOver) return;

      if (pulling) {
        plungerY = Math.min(plungerY + 0.03, 1);
        plungerPower = plungerY;
      }

      if (!ball.active) return;

      // Safety – prevent NaN
      if (isNaN(ball.x) || isNaN(ball.y) || isNaN(ball.vx) || isNaN(ball.vy)) {
        resetBall();
        return;
      }

      ball.vy += gravity;
      ball.vx *= friction;
      ball.vy *= friction;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Chute walls (strong)
      if (ball.inChute) {
        if (ball.x < 369) ball.x = 369;
        if (ball.x > 387) ball.x = 387;

        // Leave chute at the top
        if (ball.y < 68) {
          ball.inChute = false;
          ball.vx = -2.8 - Math.random() * 1.4;
          ball.vy *= 0.65;
        }
      } else {
        // Playfield walls
        if (ball.x < 13) {
          ball.x = 13;
          ball.vx *= -0.68;
        }
        if (ball.x > 387) {
          ball.x = 387;
          ball.vx *= -0.68;
        }
      }

      // Top
      if (ball.y < 13) {
        ball.y = 13;
        ball.vy *= -0.55;
      }

      // Floor – stop the ball so it can be caught
      if (ball.y > 555) {
        ball.y = 555;
        ball.vy *= -0.3;
        ball.vx *= 0.75;
        if (Math.abs(ball.vy) < 0.4) ball.vy = 0;
      }

      checkPins();
      checkPockets();
    }

    function draw() {
      // Background
      const g = ctx.createLinearGradient(0, 0, 0, 580);
      g.addColorStop(0, '#5e3b1f');
      g.addColorStop(1, '#3a2415');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 400, 580);

      // Grain
      ctx.strokeStyle = 'rgba(0,0,0,0.1)';
      for (let y = 0; y < 580; y += 15) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(400, y + 2);
        ctx.stroke();
      }

      // Arch
      ctx.beginPath();
      ctx.moveTo(12, 42);
      ctx.quadraticCurveTo(200, -30, 388, 42);
      ctx.strokeStyle = '#2a190f';
      ctx.lineWidth = 9;
      ctx.stroke();

      // Right chute
      ctx.fillStyle = '#2a190f';
      ctx.fillRect(365, 55, 30, 510);
      ctx.fillStyle = '#4a301a';
      ctx.fillRect(369, 55, 22, 510);

      // Pins
      for (let i = 0; i < pins.length; i++) {
        const pin = pins[i];
        ctx.beginPath();
        ctx.arc(pin.x, pin.y, 3.7, 0, Math.PI * 2);
        ctx.fillStyle = '#d4a96a';
        ctx.fill();
        ctx.strokeStyle = '#2a190f';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Pockets + numbers on the bottom line
      for (let i = 0; i < pockets.length; i++) {
        const p = pockets[i];
        // Half moon
        ctx.beginPath();
        ctx.arc(p.x + 20, 538, 19, Math.PI, 0);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fill();
        ctx.strokeStyle = '#c49a6c';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Number clearly under it
        ctx.fillStyle = '#f0d9a0';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.label, p.x + 20, 568);
      }

      // Plunger
      const py = 515 + plungerY * 42;
      ctx.fillStyle = '#999';
      ctx.fillRect(373, py, 14, 36);
      ctx.fillStyle = '#ddd';
      ctx.fillRect(375, py, 10, 8);

      // Instruction
      if (!ball.active && !gameOver) {
        ctx.fillStyle = 'rgba(240,217,160,0.9)';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(pulling ? 'RELEASE!' : 'PULL PLUNGER →', 358, 550);
      }

      // Ball
      const bg = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.radius);
      bg.addColorStop(0, '#fff');
      bg.addColorStop(0.5, '#ddd');
      bg.addColorStop(1, '#999');
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Controls
    function startPull(x) {
      if (gameOver || ball.active) return;
      if (x > 340) pulling = true;
    }
    function endPull() {
      if (pulling) {
        pulling = false;
        fireBall();
      }
    }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches[0].clientX - rect.left) * (400 / rect.width);
      startPull(x);
    }, {passive: false});

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      endPull();
    }, {passive: false});

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (400 / rect.width);
      startPull(x);
    });
    canvas.addEventListener('mouseup', endPull);

    document.addEventListener('keydown', e => {
      if ((e.code === 'Space' || e.code === 'ArrowDown') && !pulling && !ball.active) {
        pulling = true;
      }
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'Space' || e.code === 'ArrowDown') endPull();
    });

    restartBtn.addEventListener('click', restartGame);
    restartBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      restartGame();
    });

    resetBall();
    loop();
  </script>
</body>
</html>
