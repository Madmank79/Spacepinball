<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cosmic Bagatelle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a120b;
      color: #f5e6c8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    h1 {
      font-size: 1.45rem;
      margin-bottom: 5px;
      color: #e8c07a;
    }
    #ui {
      display: flex;
      gap: 18px;
      margin-bottom: 7px;
      font-size: 1.05rem;
      font-weight: 600;
    }
    #ui span { color: #f0d9a0; }
    #game-container {
      position: relative;
      border: 4px solid #5c3a1e;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
      background: #3b2414;
    }
    canvas { display: block; border-radius: 4px; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(20,10,5,0.87);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 20;
      text-align: center;
    }
    #overlay.show { display: flex; }
    #overlay h2 { font-size: 1.5rem; color: #e8a050; margin-bottom: 8px; }
    #overlay p { font-size: 1.1rem; margin: 3px 0; }
    .btn {
      margin-top: 16px;
      padding: 12px 32px;
      font-size: 1.1rem;
      background: linear-gradient(90deg, #8b5a2b, #c49a6c);
      border: none;
      border-radius: 30px;
      color: #1a120b;
      font-weight: 700;
      cursor: pointer;
    }
    .controls {
      margin-top: 9px;
      text-align: center;
      color: #c4a574;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <h1>🪵 COSMIC BAGATELLE</h1>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="highScore">0</span></div>
    <div>Balls: <span id="ballsLeft">5</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="400" height="580"></canvas>
    <div id="overlay">
      <h2>Game Over</h2>
      <p>Final Score: <span id="finalScore">0</span></p>
      <p>High Score: <span id="finalHigh">0</span></p>
      <button class="btn" id="restartBtn">Play Again</button>
    </div>
  </div>

  <div class="controls">
    Pull the plunger on the right, then release to fire
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const ballsLeftEl = document.getElementById('ballsLeft');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighEl = document.getElementById('finalHigh');
    const restartBtn = document.getElementById('restartBtn');

    let highScore = parseInt(localStorage.getItem('bagatelleHigh') || '0');
    highScoreEl.textContent = highScore;

    let score = 0;
    let ballsLeft = 5;
    let gameOver = false;

    // Plunger
    let plungerY = 0;
    let pulling = false;
    let plungerPower = 0;

    // Ball
    const ball = {
      x: 378,
      y: 510,
      vx: 0,
      vy: 0,
      radius: 7,
      active: false,
      settled: false,
      inChute: true
    };

    // Pins
    const pins = [];
    function buildPins() {
      for (let row = 0; row < 10; row++) {
        const count = row + 1;
        const startX = 200 - (count - 1) * 16;
        for (let i = 0; i < count; i++) {
          pins.push({ x: startX + i * 32, y: 55 + row * 28 });
        }
      }
      [[70,340],[110,360],[290,350],[330,340],
       [85,410],[150,430],[250,425],[320,405],
       [60,280],[340,270],[180,300],[220,310]].forEach(p => {
        pins.push({ x: p[0], y: p[1] });
      });
    }
    buildPins();

    // Half-moon pockets
    const pockets = [
      { x: 45,  points: 90,  label: '90' },
      { x: 95,  points: 125, label: '125' },
      { x: 150, points: 150, label: '150' },
      { x: 210, points: 100, label: '100' },
      { x: 265, points: 80,  label: '80' },
      { x: 315, points: 60,  label: '60' }
    ];

    const gravity = 0.16;
    const friction = 0.993;

    function updateHigh() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('bagatelleHigh', highScore);
        highScoreEl.textContent = highScore;
      }
    }

    function resetBall() {
      ball.x = 378;
      ball.y = 510;
      ball.vx = 0;
      ball.vy = 0;
      ball.active = false;
      ball.settled = false;
      ball.inChute = true;
      plungerY = 0;
      plungerPower = 0;
    }

    function fireBall() {
      if (ball.active || gameOver || ballsLeft <= 0) return;
      ball.active = true;
      ball.settled = false;
      ball.inChute = true;
      const power = 11 + plungerPower * 13;
      ball.vy = -power;
      ball.vx = 0;                 // go straight up the chute first
      ballsLeft--;
      ballsLeftEl.textContent = ballsLeft;
      plungerY = 0;
      plungerPower = 0;
    }

    function checkPins() {
      if (ball.inChute) return;   // no pin collision while in chute

      for (const pin of pins) {
        const dx = ball.x - pin.x;
        const dy = ball.y - pin.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.01) continue; // safety
        if (dist < ball.radius + 4.2) {
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = (ball.radius + 4.2) - dist;
          ball.x += nx * overlap;
          ball.y += ny * overlap;
          const dot = ball.vx * nx + ball.vy * ny;
          ball.vx -= 1.8 * dot * nx;
          ball.vy -= 1.8 * dot * ny;
          ball.vx += (Math.random() - 0.5) * 0.7;
        }
      }
    }

    function checkPockets() {
      if (ball.settled || !ball.active || ball.inChute) return;
      if (ball.y < 495) return;
      if (Math.abs(ball.vx) > 1.5 || Math.abs(ball.vy) > 1.5) return;

      for (const p of pockets) {
        const cx = p.x + 22;
        const cy = 535;
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        if (Math.sqrt(dx*dx + dy*dy) < 22) {
          ball.settled = true;
          ball.active = false;
          ball.x = cx;
          ball.y = cy;
          score += p.points;
          scoreEl.textContent = score;
          updateHigh();

          setTimeout(() => {
            if (ballsLeft > 0) resetBall();
            else endGame();
          }, 750);
          return;
        }
      }
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = score;
      finalHighEl.textContent = highScore;
      overlay.classList.add('show');
    }

    function restartGame() {
      score = 0;
      ballsLeft = 5;
      gameOver = false;
      scoreEl.textContent = 0;
      ballsLeftEl.textContent = 5;
      overlay.classList.remove('show');
      resetBall();
    }

    function update() {
      if (gameOver) return;

      if (pulling) {
        plungerY = Math.min(plungerY + 0.028, 1);
        plungerPower = plungerY;
      }

      if (!ball.active) return;

      ball.vy += gravity;
      ball.vx *= friction;
      ball.vy *= friction;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // ===== STRONG CHUTE WALLS =====
      if (ball.inChute) {
        // Keep ball inside the right track
        if (ball.x < 368) ball.x = 368;
        if (ball.x > 388) ball.x = 388;

        // Top of chute – release into the board
        if (ball.y < 70) {
          ball.inChute = false;
          ball.vx = -2.5 - Math.random() * 1.5; // push left into the pins
          ball.vy *= 0.7;
        }
      } else {
        // Normal playfield walls
        if (ball.x < 14) {
          ball.x = 14;
          ball.vx *= -0.7;
        }
        if (ball.x > 386) {
          ball.x = 386;
          ball.vx *= -0.7;
        }
      }

      // Top and bottom
      if (ball.y < 14) {
        ball.y = 14;
        ball.vy *= -0.6;
      }
      if (ball.y > 562) {
        ball.y = 562;
        ball.vy *= -0.35;
        ball.vx *= 0.8;
      }

      checkPins();
      checkPockets();
    }

    function draw() {
      // Wood background
      const g = ctx.createLinearGradient(0, 0, 0, 580);
      g.addColorStop(0, '#5e3b1f');
      g.addColorStop(1, '#3a2415');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 400, 580);

      // Wood grain
      ctx.strokeStyle = 'rgba(0,0,0,0.1)';
      for (let y = 0; y < 580; y += 16) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(400, y + 3);
        ctx.stroke();
      }

      // Top arch
      ctx.beginPath();
      ctx.moveTo(15, 45);
      ctx.quadraticCurveTo(200, -25, 385, 45);
      ctx.strokeStyle = '#2a190f';
      ctx.lineWidth = 9;
      ctx.stroke();

      // Right launch chute (visual)
      ctx.fillStyle = '#2a190f';
      ctx.fillRect(365, 60, 30, 500);
      ctx.fillStyle = '#4a301a';
      ctx.fillRect(369, 60, 22, 500);

      // Pins
      pins.forEach(pin => {
        ctx.beginPath();
        ctx.arc(pin.x, pin.y, 3.8, 0, Math.PI * 2);
        ctx.fillStyle = '#d4a96a';
        ctx.fill();
        ctx.strokeStyle = '#2a190f';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // Half-moon pockets
      pockets.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x + 22, 535, 22, Math.PI, 0);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fill();
        ctx.strokeStyle = '#c49a6c';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#f0d9a0';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.label, p.x + 22, 528);
      });

      // Plunger
      const plungerDrawY = 520 + plungerY * 45;
      ctx.fillStyle = '#999';
      ctx.fillRect(373, plungerDrawY, 14, 38);
      ctx.fillStyle = '#ddd';
      ctx.fillRect(375, plungerDrawY, 10, 9);

      // Instruction
      if (!ball.active && !gameOver) {
        ctx.fillStyle = 'rgba(240,217,160,0.85)';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(pulling ? 'RELEASE!' : 'PULL PLUNGER →', 360, 555);
      }

      // Ball
      const bg = ctx.createRadialGradient(ball.x-2, ball.y-2, 0, ball.x, ball.y, ball.radius);
      bg.addColorStop(0, '#fff');
      bg.addColorStop(0.5, '#ddd');
      bg.addColorStop(1, '#999');
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Controls
    function startPull(x) {
      if (gameOver || ball.active) return;
      if (x > 340) pulling = true;
    }
    function endPull() {
      if (pulling) {
        pulling = false;
        fireBall();
      }
    }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches[0].clientX - rect.left) * (400 / rect.width);
      startPull(x);
    }, {passive: false});

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      endPull();
    }, {passive: false});

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (400 / rect.width);
      startPull(x);
    });
    canvas.addEventListener('mouseup', endPull);

    document.addEventListener('keydown', e => {
      if ((e.code === 'Space' || e.code === 'ArrowDown') && !pulling && !ball.active) {
        pulling = true;
      }
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'Space' || e.code === 'ArrowDown') endPull();
    });

    restartBtn.addEventListener('click', restartGame);
    restartBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      restartGame();
    });

    resetBall();
    loop();
  </script>
</body>
</html>
